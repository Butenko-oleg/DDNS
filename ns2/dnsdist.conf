-- dnsdist перед вторичным PowerDNS.
-- Задача одна: не дать чужому флуду дойти до сервера и до канала офиса.

-- Слушаем всё: за NAT-ом роутера это единственный вход.
setLocal("0.0.0.0:53")

-- ВАЖНО: по умолчанию dnsdist пускает только localhost.
-- Без этой строки сервер будет молча игнорировать запросы из интернета.
setACL({"0.0.0.0/0", "::/0"})

-- Единственный бэкенд — PowerDNS в этой же docker-сети.
-- Адрес статический, задан в docker-compose.yml: dnsdist не умеет имена хостов.
newServer({
    address = "172.29.0.3:5300",
    name = "ns2-pdns",
    checkInterval = 0,
    -- передаём PowerDNS реальный адрес клиента, иначе все запросы выглядят
    -- приходящими от dnsdist и NOTIFY от ns1 отвергается
    useProxyProtocol = true
})

-- ---------- лимиты, чтобы не забить канал ----------
-- Обычный резолвер делает единицы запросов в секунду. 20/с с одного адреса —
-- это с большим запасом, а всё, что выше, почти наверняка флуд.
addAction(MaxQPSIPRule(20, 40, 10), DropAction())

-- Общий потолок: даже распределённый флуд не должен съедать весь канал.
-- Именно QPSAction, а не MaxQPSRule: в dnsdist 1.9.16 правило MaxQPSRule
-- в паре с DropAction режет вообще все запросы, включая первые (проверено).
addAction(AllRule(), QPSAction(3000))

-- TCP: каждая сессия дороже UDP, поэтому ограничиваем жёстко.
setMaxTCPConnectionsPerClient(8)
setMaxTCPQueriesPerConnection(20)
setMaxTCPConnectionDuration(30)
setMaxTCPQueuedConnections(200)

-- Никакой лишней болтливости.
setVerbose(false)
