# PowerDNS на ns2 — только вторичный режим.
# Подстановку @NS1_IP@ делает setup-ns2.sh из ns2.env.
#
# Бэкенд LMDB, а не sqlite: файл базы создаётся сам при первом запуске,
# никакой схемы и никакого отдельного СУБД-процесса не нужно.

launch=lmdb
lmdb-filename=/var/lib/powerdns/pdns.lmdb

# Слушаем только внутри docker-сети: снаружи стоит dnsdist.
local-address=0.0.0.0
local-port=5300

# ---------- вторичный режим ----------
secondary=yes
autosecondary=yes
allow-notify-from=@NS1_IP@
xfr-cycle-interval=30

# dnsdist стоит спереди и передаёт реальный адрес клиента через PROXY protocol.
# Без этого PowerDNS видит источником запросов сам dnsdist (172.29.0.2) и
# отвергает NOTIFY от первичного сервера: "which is not a primary (Refused)".
proxy-protocol-from=172.29.0.0/16

# ---------- наружу ничего лишнего ----------
api=no
webserver=no
disable-axfr=yes

# ---------- лимиты TCP ----------
max-tcp-connections=40
max-tcp-connections-per-client=8
max-tcp-transactions-per-conn=4

# ---------- журнал ----------
loglevel=4
log-timestamp=yes
