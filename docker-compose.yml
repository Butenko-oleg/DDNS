services:

  postgres:
    image: postgres:16
    container_name: buten-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-powerdns}
      POSTGRES_USER: ${DB_USER:-pdns}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан в .env}

    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      buten_net:
        ipv4_address: 172.28.0.10

  powerdns:
    image: powerdns/pdns-auth-49
    container_name: buten-powerdns
    restart: unless-stopped

    depends_on:
      - postgres

    volumes:
      - ./powerdns/pdns.conf:/etc/powerdns/pdns.conf:ro

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # PowerDNS HTTP API (8081) намеренно не публикуется наружу —
      # ddns-api достаёт его по внутренней docker-сети (http://powerdns:8081).

    networks:
      buten_net:
        ipv4_address: 172.28.0.11

  ddns-api:
    build:
      context: ./api

    container_name: buten-ddns-api

    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      - powerdns

    volumes:
      # Лог неудачных попыток входа для fail2ban — реальный IP клиента
      # (через X-Forwarded-For), не IP nginx.
      - ./logs:/app/logs

    environment:
       ADMIN_USER: ${ADMIN_USER:-admin}
       ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD не задан в .env}

       DDNS_ZONE: ${DDNS_ZONE:?DDNS_ZONE не задан в .env}

       PDNS_API_URL: http://powerdns:8081
       PDNS_API_KEY: ${PDNS_API_KEY:?PDNS_API_KEY не задан в .env}

       DB_HOST: postgres
       DB_NAME: ${DB_NAME:-powerdns}
       DB_USER: ${DB_USER:-pdns}
       DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан в .env}

       PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}

    networks:
      buten_net:
        ipv4_address: 172.28.0.12

networks:
  buten_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
